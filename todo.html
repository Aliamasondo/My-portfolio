<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do List | Alia's Portfolio</title><link rel="stylesheet" href="project-tools.css"></head><body><header class="topbar"><a href="index.html">← Back to portfolio</a><span>PROJECT 03</span></header><main class="app-card"><p class="eyebrow">INTERACTIVE PROJECT</p><h1>To-Do List</h1><p class="intro">Keep track of tasks, one step at a time.</p><form id="task-form" class="task-form"><label class="sr-only" for="task-input">New task</label><input id="task-input" type="text" maxlength="120" placeholder="What do you need to do?" autocomplete="off" required><button type="submit" class="primary">Add task</button></form><div class="task-summary"><span id="task-count">0 tasks</span><button id="clear-done" class="text-button" type="button">Clear completed</button></div><ul id="task-list" class="task-list"></ul><p id="empty-state" class="empty">Your list is clear. Add your first task above.</p><p class="note">Tasks are saved in this browser on this device.</p></main><script src="todo.js"></script></body></html>
